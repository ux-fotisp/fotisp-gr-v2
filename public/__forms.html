<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Registry</title>
</head>
<body>
  <!-- Static Skeleton for Netlify Form Detection at Build Time -->
  <form name="contact" data-netlify="true" netlify-honeypot="_gotcha" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="_gotcha" />
    <input type="text" name="company_fax" />
    <input type="text" name="subject" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
