<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background checkerboard 2x2 1-bit dither grid -->
    <pattern id="og-dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#080303" />
      <rect x="0" y="0" width="2" height="2" fill="#120608" />
      <rect x="2" y="2" width="2" height="2" fill="#120608" />
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace, ui-monospace; }
      .sans { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background Surface -->
  <rect width="1200" height="630" fill="url(#og-dither)" />

  <!-- Outer 1-Bit OS Window Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#261014" stroke-width="2" />
  <rect x="28" y="28" width="1144" height="574" fill="#0C0405" stroke="#EE2626" stroke-width="1" />

  <!-- System Window Titlebar -->
  <rect x="28" y="28" width="1144" height="38" fill="#16080A" stroke="#261014" stroke-width="1" />
  <!-- Window Controls -->
  <rect x="42" y="42" width="10" height="10" fill="#EE2626" />
  <rect x="58" y="42" width="10" height="10" fill="none" stroke="#EE2626" stroke-width="1" />
  <text x="80" y="50" class="mono" font-size="12" fill="#A1A1AA" letter-spacing="1.5">fotisp.gr // system_manifest.v2</text>
  <text x="1080" y="50" class="mono" font-size="12" fill="#EE2626" font-weight="bold">ATHENS · 2026</text>

  <!-- Editorial Hero Section Inside Frame -->
  <g transform="translate(70, 110)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="360" height="26" fill="#1A070A" stroke="#EE2626" stroke-width="1" />
    <text x="14" y="17" class="mono" font-size="11" font-weight="bold" fill="#EE2626" letter-spacing="2">SENIOR UX RESEARCHER · SYSTEMS ARCHITECT</text>

    <!-- Main Headline -->
    <text x="0" y="80" class="sans" font-size="56" font-weight="900" fill="#F4F4F5" letter-spacing="-1">
      Pixels change.
    </text>
    <text x="0" y="145" class="sans" font-size="56" font-weight="900" fill="#EE2626" letter-spacing="-1">
      Architecture stays.
    </text>

    <!-- Subtitle / Bio -->
    <text x="0" y="200" class="sans" font-size="20" fill="#A1A1AA">
      Clinical-grade UX research, scalable design systems, and cognitive-efficient
    </text>
    <text x="0" y="230" class="sans" font-size="20" fill="#A1A1AA">
      architectures for complex products serving millions.
    </text>

    <!-- Metrics Bar / Grounding Indicators -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="1050" height="85" fill="#120507" stroke="#261014" stroke-width="1" />

      <!-- Metric 1 -->
      <text x="30" y="32" class="mono" font-size="10" fill="#71717A" letter-spacing="1">CURRENT ROLE</text>
      <text x="30" y="58" class="mono" font-size="16" font-weight="bold" fill="#F4F4F5">Senior Assoc. / CX Designer — Pfizer</text>

      <line x1="420" y1="12" x2="420" y2="73" stroke="#261014" stroke-width="1" />

      <!-- Metric 2 -->
      <text x="450" y="32" class="mono" font-size="10" fill="#71717A" letter-spacing="1">RESEARCH RIGOR</text>
      <text x="450" y="58" class="mono" font-size="16" font-weight="bold" fill="#EE2626">4 Peer-Reviewed Publications (MDPI/IEEE)</text>

      <line x1="820" y1="12" x2="820" y2="73" stroke="#261014" stroke-width="1" />

      <!-- Metric 3 -->
      <text x="850" y="32" class="mono" font-size="10" fill="#71717A" letter-spacing="1">ACADEMIC HONOURS</text>
      <text x="850" y="58" class="mono" font-size="16" font-weight="bold" fill="#F4F4F5">MSc GPA: 9.78 / 10</text>
    </g>

    <!-- Footer Coordinate Bar -->
    <g transform="translate(0, 395)">
      <text x="0" y="0" class="mono" font-size="12" fill="#71717A">Fig. 00 · x: 0.00 y: 0.00</text>
      <text x="940" y="0" class="mono" font-size="12" fill="#EE2626">https://fotisp.gr</text>
    </g>
  </g>
</svg>
